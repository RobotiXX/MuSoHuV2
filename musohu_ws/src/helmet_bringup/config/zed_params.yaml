# Overrides loaded AFTER the wrapper's common and ZED 2i configurations.
# Target: wrapper 5.5 + SDK 5.5, Orin Nano 8 GB, walking helmet.
/**:
  ros__parameters:
    general:
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_frame_rate: 30.0
      enable_image_validity_check: 1
      sdk_timestamp_clock: SYSTEM_CLOCK
    video:
      publish_rgb: false
      publish_left_right: true
      publish_raw: false
      publish_stereo: false
      enable_24bit_output: true
    depth:
      depth_mode: NONE
    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_3
      compute_preference: PREFER_GPU
      imu_fusion: true
      area_memory: true
      # Keep odom continuous; map carries loop corrections.
      reset_odom_with_loop_closure: false
      set_as_static: false
      set_gravity_as_origin: true
      floor_alignment: false
      two_d_mode: false
      path_pub_rate: 2.0
      path_max_count: 6000
    sensors:
      # Keep full-rate IMU samples independent of image publication/subscribers.
      sensors_image_sync: false
      sensors_pub_rate: 200.0
      publish_imu: true # SDK calibrated IMU measurements and orientation
      publish_imu_raw: true # uncalibrated accel/gyro; no orientation estimate
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false
