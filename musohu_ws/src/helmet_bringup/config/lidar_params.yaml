# RoboSense native configuration; passed as the config_path parameter.
common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSHELIOS
      msop_port: 6699
      difop_port: 7788
      imu_port: 0
      min_distance: 0.2
      max_distance: 200.0
      # Helios PTP-E2E-L4 domain 0; launch checks lock and packet epoch first.
      use_lidar_clock: true
      dense_points: false
      ts_first_point: true
      start_angle: 0.0
      end_angle: 360.0
    ros:
      ros_frame_id: rslidar
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 100

# Project bringup check; ignored by the native RoboSense driver.
clock_sync:
  lidar_address: 192.168.1.200
  max_receive_age_s: 0.1
