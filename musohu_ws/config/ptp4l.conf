# MuSoHu dedicated LiDAR link: Ubuntu Jammy linuxptp 3.1.1.
# eno1 has software timestamps only. System NTP remains the host clock owner.
# Do not run phc2sys: this interface has no PHC.
[global]
time_stamping software
network_transport UDPv4
delay_mechanism E2E
domainNumber 0
twoStepFlag 1
masterOnly 1
free_running 1
clockClass 248
clockAccuracy 0xFE
offsetScaledLogVariance 0xFFFF
timeSource 0xA0
logSyncInterval -3
logAnnounceInterval 0
logMinDelayReqInterval -3
uds_address /run/musohu-ptp/ptp4l
